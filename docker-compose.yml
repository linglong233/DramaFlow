version: "3.9"
# ============================================================
# DramaFlow 开发/演示 compose（dev profile）
# 用 dev:* 命令、本地存储。
# 生产部署用 docker-compose.prod.yml override：
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
# Redis 服务在批3（BullMQ 迁移）启用，见下方 redis 注释段。
# ============================================================

services:
  postgres:
    image: postgres:17-bookworm
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dramaflow
      POSTGRES_PASSWORD: dramaflow
      POSTGRES_DB: dramaflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dramaflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: node:24-bookworm
    working_dir: /workspace
    command: bash -lc "npm install && npm run dev:web"
    ports:
      - "3000:3000"
    volumes:
      - ./:/workspace
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api

  api:
    image: node:24-bookworm
    working_dir: /workspace
    command: bash -lc "npm install && npm --workspace @dramaflow/api run prisma:migrate:deploy && npm run dev:api"
    ports:
      - "4000:4000"
    volumes:
      - ./:/workspace
    environment:
      DATABASE_URL: postgresql://dramaflow:dramaflow@postgres:5432/dramaflow?schema=public
      UPLOADS_DIR: /workspace/apps/api/uploads
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PUBLIC_URL: http://localhost:4000/uploads
      JWT_ACCESS_SECRET: replace-me
      JWT_REFRESH_SECRET: replace-me-too
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: node:24-bookworm
    working_dir: /workspace
    command: bash -lc "npm install && npm run dev:worker"
    volumes:
      - ./:/workspace
    environment:
      API_URL: http://api:4000
      UPLOADS_DIR: /workspace/apps/api/uploads
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PUBLIC_URL: http://localhost:4000/uploads
      OPENAI_COMPAT_BASE_URL: https://api.openai.com/v1
      OPENAI_COMPAT_API_KEY: replace-me
    depends_on:
      - api

  # ============================================================
  # Redis（批3 BullMQ 迁移启用，当前未使用）
  # 启用步骤：取消下面注释，api 与 worker 透传 REDIS_URL=redis://redis:6379
  # ============================================================
  # redis:
  #   image: redis:7-bookworm
  #   ports:
  #     - "6379:6379"
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
