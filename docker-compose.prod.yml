# ============================================================
# DramaFlow 生产 override
# 用法：docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 前置：npm run build 已生成各包 dist/
# ============================================================
version: "3.9"

services:
  api:
    command: bash -lc "npm --workspace @dramaflow/api run prisma:migrate:deploy && npm --workspace @dramaflow/api start"
    environment:
      NODE_ENV: production
      STORAGE_DRIVER: s3
      OPENAI_COMPAT_MOCK_FALLBACK: "false"
      # S3 配置（必须）
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # JWT 必须用安全值（不在 compose 里写死，从 .env 或 env 注入）
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g

  web:
    command: bash -lc "npm --workspace @dramaflow/web run start"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  worker:
    command: bash -lc "npm --workspace @dramaflow/worker run start"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
